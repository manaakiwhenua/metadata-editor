<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Behind a TLS-terminating ingress (Traefik), the request that reaches Apache is
    # plain HTTP, so $_SERVER['HTTPS'] is unset. CodeIgniter's config.php derives
    # base_url from it:
    #   $config['base_url'] = (isset($_SERVER['HTTPS']) && ... ) ? "https" : "http";
    # Without this, site_url() builds http:// URLs - so the OIDC redirect_uri would be
    # http://, which Keycloak rejects against an https-registered URI
    # (invalid_redirect_uri). Traefik already sends X-Forwarded-Proto: https.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
