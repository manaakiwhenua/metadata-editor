# CI for metadata-editor (web). Builds the image via the central reusable
# workflow (manaakiwhenua/github-workflows) -> prod Harbor, then triggers a
# nonprod (dev) deploy through k8s-apps-config. Fork-only (CICD-ADR-008): downstream.
#
# Image lands at: registry.landcareresearch.co.nz/mwlr-private/metadata-editor:<build_id>
#
# PREREQUISITES (not yet configured - MT-35):
#   - Repo variable: HARBOR_USERNAME (robot account, e.g. robot$github-builder)
#   - Repo secrets:  HARBOR_TOKEN (robot token), REGISTRY_CA_CERT,
#                    K8S_APPS_CONFIG_TRIGGER_TOKEN
#   - A self-hosted `tak-k8s-ci` runner (internal Harbor needs it)
#   - Dockerfile on `downstream` (web PR #3 - merged)
#   - k8s-apps-config manifests must exist (MT-36) for the deploy step to update
name: CI
on:
  push:
    branches: [downstream]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: manaakiwhenua/github-workflows/.github/workflows/docker-build.yml@main
    with:
      bake_file: docker-bake.hcl
      bake_target: default
      image_name: metadata-editor
      image_namespace: mwlr-private
      runs_on: tak-k8s-ci
      push: true
      harbor_username: ${{ vars.HARBOR_USERNAME }}
      # harbor_host defaults to registry.landcareresearch.co.nz
    secrets:
      HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
      REGISTRY_CA_CERT: ${{ secrets.REGISTRY_CA_CERT }}
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: k8s-dev
    steps:
      - uses: actions/checkout@v4
        with:
          repository: manaakiwhenua/github-workflows
          sparse-checkout: actions/k8s-deploy
          path: .github-workflows
      - name: Deploy to nonprod (dev)
        uses: ./.github-workflows/actions/k8s-deploy
        with:
          app_name: metadata-editor
          environment: dev
          cluster: tak-k8s-nonprod
          build_key: ${{ needs.build.outputs.build_id }}
          bitbucket_token: ${{ secrets.K8S_APPS_CONFIG_TRIGGER_TOKEN }}
