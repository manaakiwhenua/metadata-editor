# Field mapping for the DataCite 4.7 writer.
#
# This file contains mapping configuration only. Validation, export blockers,
# warnings, user messages, decision history, and JSON/XML serialization are
# implemented or documented separately.
#
# HOW TO READ THIS FILE
# ---------------------
# - `source` is one metadata path. `sources` supplies several named inputs
#   to one transformation. Paths use dot notation.
#
# - `target` identifies one DataCite destination; `targets` identifies several.
#   Each destination contains `property`, the DataCite metadata property used by
#   the writer, and `json_path`, its complete DataCite REST API JSON path.
#
# - The JSON serializer supplies the surrounding `data` object and the fixed
#   JSON:API member `data.type: dois`. Mapped metadata is written below
#   `data.attributes` using the paths recorded in each destination.
#
# - `filter` retains only source collection entries whose named fields exactly
#   match the configured values before the transformation runs.
#
# - `parameters` passes fixed mapping choices to the named transformation.
#
# - `field_mappings` exposes the leaf-level work performed by a structured
#   transformation. Its `source` is relative to the rule-level source object;
#   `@value` means the current scalar value or current collection item.
#
# - A leaf `sources` object supplies several relative values to one operation.
#   `value` supplies a generated constant rather than a value;
#   `value_from_parameter` and `default_value` copy named configured values.
#
# - `value_map` explicitly lists a controlled-value conversion.
#
# -  `when_source_present` and `when_any_source_present` conditionally emit
#   generated output only when the named relative source value exists.
#
# - `applies_to` identifies a conditional output branch produced by the parent
#   transformation, such as RelatedIdentifier versus RelatedItem.
#
# - `defaults` contains reusable values. 

#
# - A missing or empty optional source produces no target value. Required-field
#   checks and the resulting user messages are handled outside this file.
#
# - Mapping rules are evaluated in the order shown.
#
# TRANSFORMATIONS
# ---------------
# Transformations are names from the transformer registry/factory in the code. They
# are not executable expressions in this YAML.
#
# - strip_to_doi_identifier: recognise a bare DOI, `doi:` value, or DOI URL and
#   return the canonical DOI string 
#
# - alternative_titles: create AlternativeTitle entries for all supplied values.
#
# - publisher: create the DataCite publisher value from the supplied publisher name.
#
# - year_from_date: extract the four-digit year from the supplied publication
#   date for DataCite publicationYear.
#
# - datacite_date: create a DataCite Date with the configured date type while
#   preserving the date precision supplied.
#
# - updated_dates: create an Updated Date for each modification row and carry
#   the associated dataset version in the DataCite date information.
#
# - single_language: emit a language only when BSI Core contains exactly one
#   non-empty language; omit the property when none or several are supplied.
#
# - description: create a DataCite Description with the configured type and
#   default language.
#
# - prefixed_description: create a Description after prepending the configured
#   label, such as `Audience:` or `Provenance:`.
#
# - subjects: turn every non-empty keyword into a DataCite Subject.
#
# - related_resources: normalise the relation type and map each row as a
#   RelatedIdentifier, RelatedItem, or both, depending on whether URI and/or
#   descriptive resource text is present.
#
# - temporal_coverage: combine available start/end values into the agreed
#   DataCite temporal Date representation and add supplied free-text coverage as
#   a Description; retain supported reduced precision and open-ended coverage.
#
# - geographic_elements: create GeoLocations from bounding-box coordinates and
#   geographic descriptions. Geohashes are not converted to DataCite geometry.
#
# - rights_holder_contributor: create a RightsHolder Contributor from the source
#   organisation or person name.
#
# - access_rights: normalise the access-right code and combine it with any
#   access-right description in a DataCite Rights entry.
#
# - licence_rights: combine the licence text and/or URI into one DataCite Rights
#   entry without creating an empty entry when neither value is present.
#
# Leaf transformations used inside `field_mappings`:
#
# - normalise_orcid: trim the value, verify the ORCID pattern and retain its
#   canonical `https://orcid.org/...` URI form.
#
# - prepend_configured_prefix: prepend the rule's `prefix` parameter to text.
#
# - normalize_related_identifier: canonicalise a DOI; retain other supported
#   identifier or URI values without changing their meaning.
#
# - classify_related_identifier_type: identify the corresponding DataCite 4.7
#   relatedIdentifierType, such as DOI, Handle or URL.
#
# - relation_type_to_datacite: apply the adjacent BSI Core-to-DataCite
#   relation-type value map.
#
# - make_iso8601_interval: join start and end with `/` when both exist; when one
#   endpoint is absent, emit the available value; preserve supplied precision.
#
# - prefix_temporal_coverage: prepend `Temporal coverage:` to the supplied text.
#
# - compose_access_rights_statement: map the access-right code to its
#   configured label and append `: ` plus the description when one is supplied.

profile:
  id: bsi-core-to-datacite-4.7
  version: "0.4.0"
  source:
    system: World Bank Metadata Editor
    template: BSI Core
  target:
    schema: DataCite
    schema_version: "4.7"
    json_representation: DataCite REST API JSON:API
  path_delimiter: .

defaults:
  metadata_language: en
  datacite_type: dois
  resource_type_general: Dataset
  alternative_title_type: AlternativeTitle
  name_identifier_scheme_type: ORCID
  name_identifier_scheme_uri: https://orcid.org
  custodian_type: DataManager
  point_of_contact_type: ContactPerson
  rights_holder_type: RightsHolder
  data_collector_type: DataCollector
  other_contributor_type: Other
  funder_type: FundingReference

mappings:

  #TODO check how 'id' and 'type' are supposed to be mapped. All examples show these as present outside of the attributes block as 'dois' and the normalized doi identifier, but they're not described in the metadata properties docs.
  - id: primary_datacite_identifier
    source: optional_additional_metadata.resourceIdentifier
    target:
      json_path: data.id
    transform: strip_to_doi_identifier

  - id: primary_datacite_identifier_type
    source: null
    target:
      json_path: data.type
    transform: null
    default_value: datacite_type

  # Copy the more specific resource type into the DataCite Types object.
  # resourceType is the a free-text field describing the type of the resource. This is a mandatory field.
  # resourceTypeGeneral is the controlled vocab for the type of the resource.
  # The current BSI Core template permits only the value `Dataset`, so we'll use this for both.
  - id: resource_type
    source: required_metadata.resourceType
    target:
      json_path: data.attributes.types      
    transform: null
    mode: single_object
    field_mappings:
      - source: "@value"
        target:
          json_path: resourceType
      - source: null
        target:
          json_path: resourceTypeGeneral
        default_value: resource_type_general


  # Convert the resource identifier into the canonical DOI identifier that
  # identifies the DataCite record's dataset.
  - id: primary_identifier
    source: optional_additional_metadata.resourceIdentifier
    target:
      json_path: data.attributes.doi
    transform: strip_to_doi_identifier

  # Add the required BSI title as the primary DataCite title.
  - id: main_title
    source: required_metadata.title
    target:
      json_path: data.attributes.titles
    field_mappings:
    - source: "@value"
      target:
        json_path: title

  # Add every BSI alternative title as a DataCite AlternativeTitle.
  - id: alternative_titles
    source: optional_additional_metadata.alternativeTitle
    target:
      json_path: data.attributes.titles
    field_mappings:
      - source: "@value"
        target: 
          json_path: title
      - source: null
        target:
          json_path: titleType
        default_value: alternative_title_type

  # Select agents whose role is `author` and add them as DataCite Creators.
  - id: creators
    source: required_metadata.agents
    filter:
      role: author
    target:
      json_path: data.attributes.creators
    field_mappings:
      - source: name
        target:
          json_path: name
      - source: agentType
        target:
          json_path: nameType
        transform: transform_using_value_map
        parameters:
          value_map:
            person: Personal
            organisation: Organizational
      - source: orcid
        target:
          json_path: nameIdentifiers
        field_mappings:
          - source: "@value"
            target:
              json_path: nameIdentifier
            transform: normalise_orcid
          - source: null
            target:
              json_path: nameIdentifierScheme
            default_value: name_identifier_scheme_type
          - source: null
            target:
              json_path: schemeUri
            default_value: name_identifier_scheme_uri
      - source: affiliation
        target:
          json_path: affiliation
        field_mappings:
          - source: "@value"
            target:
              json_path: name

  # Select agents whose role is `custodian` and add them as DataManager
  # Contributors; this expresses custodianship using the closest DataCite role.
  - id: custodians
    source: required_metadata.agents
    filter:
      role: custodian
    target:
      json_path: data.attributes.contributors
    field_mappings:
      - source: name
        target:
          json_path: name
      - source: agentType
        target:
          json_path: nameType
        transform: transform_using_value_map
        parameters:
          value_map:
            person: Personal
            organisation: Organizational
      - source: orcid
        target:
          json_path: nameIdentifiers
        field_mappings:
          - source: "@value"
            target:
              json_path: nameIdentifier
            transform: normalise_orcid
          - source: null
            target:
              json_path: nameIdentifierScheme
            default_value: name_identifier_scheme_type
          - source: null
            target:
              json_path: schemeUri
            default_value: name_identifier_scheme_uri
      - source: affiliation
        target:
          json_path: affiliation
        field_mappings:
          - source: "@value"
            target:
              json_path: name
      - source: null
        target:
          json_path: contributorType
        default_value: custodian_type
    
  # Select `pointOfContact` agents and add them as ContactPerson Contributors.
  - id: points_of_contact
    source: required_metadata.agents
    filter:
      role: pointOfContact
    target:
      json_path: data.attributes.contributors
    field_mappings:
      - source: name
        target:
          json_path: name
      - source: agentType
        target:
          json_path: nameType
        transform: transform_using_value_map
        parameters:
          value_map:
            person: Personal
            organisation: Organizational
      - source: orcid
        target:
          json_path: nameIdentifiers
        field_mappings:
          - source: "@value"
            target:
              json_path: nameIdentifier
            transform: normalise_orcid
          - source: null
            target:
              json_path: nameIdentifierScheme
            default_value: name_identifier_scheme_type
          - source: null
            target:
              json_path: schemeUri
            default_value: name_identifier_scheme_uri
      - source: affiliation
        target:
          json_path: affiliation
        field_mappings:
          - source: "@value"
            target:
              json_path: name
      - source: null
        target:
          json_path: contributorType
        default_value: point_of_contact_type

  # Select `dataCollector` agents and add them as DataCollector Contributors.
  - id: data_collectors
    source: required_metadata.agents
    filter:
      role: dataCollector
    target:
      json_path: data.attributes.contributors
    field_mappings:
      - source: name
        target:
          json_path: name
      - source: agentType
        target:
          json_path: nameType
        transform: transform_using_value_map
        parameters:
          value_map:
            person: Personal
            organisation: Organizational
      - source: orcid
        target:
          json_path: nameIdentifiers
        field_mappings:
          - source: "@value"
            target:
              json_path: nameIdentifier
            transform: normalise_orcid
          - source: null
            target:
              json_path: nameIdentifierScheme
            default_value: name_identifier_scheme_type
          - source: null
            target:
              json_path: schemeUri
            default_value: name_identifier_scheme_uri
      - source: affiliation
        target:
          json_path: affiliation
        field_mappings:
          - source: "@value"
            target:
              json_path: name
      - source: null
        target:
          json_path: contributorType
        default_value: data_collector_type

  # Select generic `contributor` agents and add them as Other Contributors.
  - id: other_contributors
    source: required_metadata.agents
    filter:
      role: contributor
    target:
      json_path: data.attributes.contributors
    field_mappings:
      - source: name
        target:
          json_path: name
      - source: agentType
        target:
          json_path: nameType
        transform: transform_using_value_map
        parameters:
          value_map:
            person: Personal
            organisation: Organizational
      - source: orcid
        target:
          json_path: nameIdentifiers
        field_mappings:
          - source: "@value"
            target:
              json_path: nameIdentifier
            transform: normalise_orcid
          - source: null
            target:
              json_path: nameIdentifierScheme
            default_value: name_identifier_scheme_type
          - source: null
            target:
              json_path: schemeUri
            default_value: name_identifier_scheme_uri
      - source: affiliation
        target:
          json_path: affiliation
        field_mappings:
          - source: "@value"
            target:
              json_path: name
      - source: null
        target:
          json_path: contributorType
        default_value: other_contributor_type

  # Select `funder` agents and add their names as DataCite FundingReferences.
  - id: funders
    source: required_metadata.agents
    filter:
      role: funder
    target:
      json_path: data.attributes.fundingReferences
    field_mappings:
      - source: name
        target:
          json_path: funderName

  # Map the required BSI publisher name to the DataCite publisher property.
  - id: publisher
    source: required_metadata.publisher
    target:
      json_path: data.attributes.publisher
    transform: publisher
    mode: single_object
    field_mappings:
      - source: "@value"
        target:
          json_path: name

  # Derive DataCite publicationYear from the year component of datePublished.
  - id: publication_year
    source: optional_additional_metadata.datePublished
    target:
      json_path: data.attributes.publicationYear
    transform: year_from_date

  # Also preserve the complete datePublished value as a DataCite Issued Date.
  - id: issued_date
    source: optional_additional_metadata.datePublished
    target:
      json_path: data.attributes.dates
    transform: datacite_date
    parameters:
      date_type: Issued
    field_mappings:
      - source: "@value"
        target:
          json_path: date
      - value_from_parameter: date_type
        target:
          json_path: dateType

  # Add BSI dateCreated as a DataCite Created Date, preserving its precision.
  - id: created_date
    source: required_metadata.dateCreated
    target:
      json_path: data.attributes.dates
    transform: datacite_date
    parameters:
      date_type: Created
    field_mappings:
      - source: "@value"
        target:
          json_path: date
      - value_from_parameter: date_type
        target:
          json_path: dateType

  # Add every dateModified row as an Updated Date and retain the version paired
  # with that date as DataCite date information.
  - id: modification_dates
    source: optional_additional_metadata.dateModified
    target:
      json_path: data.attributes.dates
    transform: updated_dates
    field_mappings:
      - source: date
        target:
          json_path: date
      - value: Updated
        target:
          json_path: dateType
      - source: version
        target:
          json_path: dateInformation

  # Map the BSI language only when there is one value. DataCite has one language
  # property, so multiple BSI languages are omitted and reported outside YAML.
  - id: language
    source: optional_additional_metadata.language
    target:
      json_path: data.attributes.language
    transform: single_language

  # Add the required BSI description as the DataCite Abstract description.
  - id: abstract
    source: required_metadata.description
    target:
      json_path: data.attributes.descriptions
    transform: description
    parameters:
      description_type: Abstract
      language_default: metadata_language
    field_mappings:
      - source: "@value"
        target:
          json_path: description
      - value_from_parameter: description_type
        target:
          json_path: descriptionType
      - default_value: metadata_language
        target:
          json_path: lang

  # Preserve audience information in an Other Description prefixed `Audience:`.
  - id: audience
    source: optional_additional_metadata.audience
    target:
      json_path: data.attributes.descriptions
    transform: prefixed_description
    parameters:
      description_type: Other
      prefix: "Audience:"
      language_default: metadata_language
    field_mappings:
      - source: "@value"
        target:
          json_path: description
        transform: prepend_configured_prefix
      - value_from_parameter: description_type
        target:
          json_path: descriptionType
      - default_value: metadata_language
        target:
          json_path: lang

  # Preserve provenance in an Other Description prefixed `Provenance:`.
  - id: provenance
    source: optional_additional_metadata.provenance
    target:
      json_path: data.attributes.descriptions
    transform: prefixed_description
    parameters:
      description_type: Other
      prefix: "Provenance:"
      language_default: metadata_language
    field_mappings:
      - source: "@value"
        target:
          json_path: description
        transform: prepend_configured_prefix
      - value_from_parameter: description_type
        target:
          json_path: descriptionType
      - default_value: metadata_language
        target:
          json_path: lang

  # Preserve general comments in an Other Description prefixed `Comments:`.
  - id: comments
    source: optional_additional_metadata.comments
    target:
      json_path: data.attributes.descriptions
    transform: prefixed_description
    parameters:
      description_type: Other
      prefix: "Comments:"
      language_default: metadata_language
    field_mappings:
      - source: "@value"
        target:
          json_path: description
        transform: prepend_configured_prefix
      - value_from_parameter: description_type
        target:
          json_path: descriptionType
      - default_value: metadata_language
        target:
          json_path: lang

  # Add every BSI keyword as an individual DataCite Subject.
  - id: keywords
    source: required_metadata.keywords
    target:
      json_path: data.attributes.subjects
    transform: subjects
    field_mappings:
      - source: "@value"
        target:
          json_path: subject

  # Add every listed BSI data format to the DataCite formats collection.
  - id: formats
    source: optional_additional_metadata.dataFormat
    target:
      json_path: data.attributes.formats
    transform: null

  # Copy the current BSI dataset version to DataCite version.
  - id: dataset_version
    source: optional_additional_metadata.datasetVersion
    target:
      json_path: data.attributes.version
    transform: null

  # Map each related-resource row according to the available content: URI only
  # becomes a RelatedIdentifier; text only becomes a RelatedItem; both produces
  # both structures, with the identifier repeated in the RelatedItem.
  - id: related_resources
    source: optional_additional_metadata.relatedResources
    targets:
      - json_path: data.attributes.relatedIdentifiers
      - json_path: data.attributes.relatedItems
    transform: related_resources
    field_mappings:
      - source: uri
        applies_to: relatedIdentifiers
        target:
          json_path: relatedIdentifier
        transform: normalize_related_identifier
      - source: uri
        applies_to: relatedIdentifiers
        target:
          json_path: relatedIdentifierType
        transform: classify_related_identifier_type
      - source: relationType
        applies_to: relatedIdentifiers
        target:
          json_path: relationType
        transform: transform_using_value_map
        parameters:
          value_map:
            isDerivedFrom: IsDerivedFrom
            isPartOf: IsPartOf
            hasPart: HasPart
            isDocumentedBy: IsDocumentedBy
            isDescribedBy: IsDescribedBy
            references: References
            cites: Cites
            isVersionOf: IsVersionOf
            isNewVersionOf: IsNewVersionOf
            requires: Requires
            other: Other
      - source: relationTypeInformation
        applies_to: relatedIdentifiers
        target:
          json_path: relationTypeInformation
      - source: resource
        applies_to: relatedItems
        target:
          json_path: titles
        field_mappings:
          - source: resource
            target:
              json_path: title
      - value: Other
        applies_to: relatedItems
        target:
          json_path: relatedItemType
      - source: relationType
        applies_to: relatedItems
        target:
          json_path: relationType
        transform: transform_using_value_map
        parameters:
          value_map:
            isDerivedFrom: IsDerivedFrom
            isPartOf: IsPartOf
            hasPart: HasPart
            isDocumentedBy: IsDocumentedBy
            isDescribedBy: IsDescribedBy
            references: References
            cites: Cites
            isVersionOf: IsVersionOf
            isNewVersionOf: IsNewVersionOf
            requires: Requires
            other: Other
      - source: relationTypeInformation
        applies_to: relatedItems
        target:
          json_path: relationTypeInformation
      - source: uri
        applies_to: relatedItems
        when_source_present: uri
        target:
          json_path: relatedItemIdentifier.relatedItemIdentifier
        transform: normalize_related_identifier
      - source: uri
        applies_to: relatedItems
        when_source_present: uri
        target:
          json_path: relatedItemIdentifier.relatedItemIdentifierType
        transform: classify_related_identifier_type

  # Map structured start/end temporal coverage to DataCite Dates and preserve a
  # supplied temporal description in the DataCite descriptions collection.
  - id: temporal_coverage
    source: optional_additional_metadata.temporalCoverage
    targets:
      - json_path: data.attributes.dates
      - json_path: data.attributes.descriptions
    transform: temporal_coverage
    parameters:
      language_default: metadata_language
    field_mappings:
      - sources:
          start: start
          end: end
        target:
          json_path: date
        transform: make_iso8601_interval
      - value: Coverage
        when_any_source_present:
          - start
          - end
        target:
          json_path: dateType
      - source: description
        target:
          json_path: description
        transform: prefix_temporal_coverage
      - value: Other
        when_source_present: description
        target:
          json_path: descriptionType
      - default_value: metadata_language
        when_source_present: description
        target:
          json_path: lang

  # Convert each geographic element's bounding box and/or place description to
  # a DataCite GeoLocation. The transformer does not convert geohash values.
  - id: geographic_coverage
    source: optional_additional_metadata.geographicCoverage.geographicElement
    target:
      json_path: data.attributes.geoLocations
    transform: geographic_elements
    field_mappings:
      - source: geographicDescription
        target:
          json_path: geoLocationPlace
      - source: geographicBoundingBox.westBoundLongitude
        target:
          json_path: geoLocationBox.westBoundLongitude
      - source: geographicBoundingBox.eastBoundLongitude
        target:
          json_path: geoLocationBox.eastBoundLongitude
      - source: geographicBoundingBox.southBoundLatitude
        target:
          json_path: geoLocationBox.southBoundLatitude
      - source: geographicBoundingBox.northBoundLatitude
        target:
          json_path: geoLocationBox.northBoundLatitude

  # Add the BSI rights-holder name as a DataCite RightsHolder Contributor.
  - id: rights_holder
    source: optional_additional_metadata.rightsHolder
    target:
      json_path: data.attributes.contributors
    field_mappings:
      - source: "@value"
        target:
          json_path: name
      - source: null
        target:
          json_path: contributorType
        default_value: rights_holder_type

  # Convert the BSI Core access-right type and optional explanation into a DataCite
  # Rights entry, including normalisation of the access-right code.
  - id: access_rights
    source: optional_additional_metadata.accessRights
    target:
      json_path: data.attributes.rightsList
    transform: access_rights
    parameters:
      access_type_labels:
        open: Open
        restricted: Restricted
        embargoed: Embargoed
        internal: Internal
        accessByAgreement: ByAgreement
        other: Other
      description_separator: ": "
    field_mappings:
      - sources:
          type: accessRightsType
          description: accessRightsDescription
        target:
          json_path: rights
        transform: compose_access_rights_statement

  # Combine the BSI licence wording and licence URI into one DataCite Rights
  # entry; either source may be used when the other is absent.
  - id: licence
    sources:
      details: optional_additional_metadata.licenseDetails
      uri: optional_additional_metadata.licenseURI
    target:
      json_path: data.attributes.rightsList
    transform: licence_rights
    field_mappings:
      - source: details
        target:
          json_path: rights
      - source: uri
        target:
          json_path: rightsUri
