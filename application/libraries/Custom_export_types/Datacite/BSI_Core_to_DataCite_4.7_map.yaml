# Inner object mapping for the DataCite 4.7 writer.
#
# This file contains mapping configuration only. Validation, export blockers,
# warnings, user messages, decision history, and JSON/XML serialization are
# implemented or documented separately.
#
# HOW TO READ THIS FILE
# ---------------------
# - `source` is one metadata path. `sources` supplies several named inputs
#   to one transformation. Paths use dot notation.
#
# - `target` identifies one DataCite destination; `targets` identifies several.
#   Each target indicates the json path within the DataCite REST API payload. 
#   A target within a inner object mapping is a single field in the object structure.
#
# - The JSON serializer supplies the surrounding `data` object and the fixed
#   JSON:API member `data.type: dois`. Mapped metadata is written below
#   `data.attributes` using the paths recorded in each destination.
#
# - `filter` retains only source collection entries whose named fields exactly
#   match the configured values before the transformation runs.
#
# - `parameters` passes fixed mapping choices to the named transformation.
#
# - `inner_object_mappings` exposes the leaf-level work performed by a structured
#   transformation. Its `source` is relative to the rule-level source object;
#   `@value` means the current scalar value or current collection item.
#
# - A leaf `sources` object supplies several relative values to one operation.
#   `value` supplies a generated constant rather than a value;
#   `value_from_parameter` and `default_value` copy named configured values.
#
# - `value_map` explicitly lists a controlled-value conversion.
#
# -  `when_source_present` and `when_any_source_present` conditionally emit
#   generated output only when the named relative source value exists.
#
# - `applies_to` identifies a conditional output branch produced by the parent
#   transformation, such as RelatedIdentifier versus RelatedItem.
#
# - `defaults` contains reusable values. 

#
# - A missing or empty optional source produces no target value. Required-field
#   checks and the resulting user messages are handled outside this file.
#
# - Mapping rules are evaluated in the order shown.
#
# TRANSFORMATIONS
# ---------------
# Transformations are names from the transformer registry/factory in the code. They
# are not executable expressions in this YAML.
#
# - strip_to_doi_identifier: recognise a bare DOI, `doi:` value, or DOI URL and
#   return the canonical DOI string 
#
# - year_from_date: extract the four-digit year from the supplied publication
#   date for DataCite publicationYear.
#
# - datacite_date: create a DataCite Date with the configured date type while
#   preserving the date precision supplied.
#
# - updated_dates: create an Updated Date for each modification row and carry
#   the associated dataset version in the DataCite date information.
#
# - single_language: emit a language only when BSI Core contains exactly one
#   non-empty language; omit the property when none or several are supplied.
#
# - description: create a DataCite Description with the configured type and
#   default language.
#
# - prefixed_description: create a Description after prepending the configured
#   label, such as `Audience:` or `Provenance:`.
#
# - subjects: turn every non-empty keyword into a DataCite Subject.
#
# - related_resources: normalise the relation type and map each row as a
#   RelatedIdentifier, RelatedItem, or both, depending on whether URI and/or
#   descriptive resource text is present.
#
# - temporal_coverage: combine available start/end values into the agreed
#   DataCite temporal Date representation and add supplied free-text coverage as
#   a Description; retain supported reduced precision and open-ended coverage.
#
# - geographic_elements: create GeoLocations from bounding-box coordinates and
#   geographic descriptions. Geohashes are not converted to DataCite geometry.
#
# - rights_holder_contributor: create a RightsHolder Contributor from the source
#   organisation or person name.
#
# - access_rights: normalise the access-right code and combine it with any
#   access-right description in a DataCite Rights entry.
#
# - licence_rights: combine the licence text and/or URI into one DataCite Rights
#   entry without creating an empty entry when neither value is present.
#
# Leaf transformations used inside `inner_object_mappings`:
#
# - normalise_orcid: trim the value, verify the ORCID pattern and retain its
#   canonical `https://orcid.org/...` URI form.
#
# - prepend_configured_prefix: prepend the rule's `prefix` parameter to text.
#
# - normalize_related_identifier: canonicalise a DOI; retain other supported
#   identifier or URI values without changing their meaning.
#
# - classify_related_identifier_type: identify the corresponding DataCite 4.7
#   relatedIdentifierType, such as DOI, Handle or URL.
#
# - relation_type_to_datacite: apply the adjacent BSI Core-to-DataCite
#   relation-type value map.
#
# - make_iso8601_interval: join start and end with `/` when both exist; when one
#   endpoint is absent, emit the available value; preserve supplied precision.
#
# - prefix_temporal_coverage: prepend `Temporal coverage:` to the supplied text.
#
# - compose_access_rights_statement: map the access-right code to its
#   configured label and append `: ` plus the description when one is supplied.

# Several rules target the same path and their results are applied in rule order.
# Transformations are only applied if there is no inner object mapping for the rule. Transformations for nested fields should be placed inside the inner object mapping block.

# SUPPORTED KEYWORDS USED IN MAPPING RULES 
# This is a work in progress - these are the currently supported keywords in mapping rules:
#
# id
# source
# target
# transformer
# default_value
# mode
# inner_object_mappings
# filter



profile:
  id: bsi-core-to-datacite-4.7
  version: "0.4.0"
  source:
    system: World Bank Metadata Editor
    template: BSI Core
  target:
    schema: DataCite
    schema_version: "4.7"
    json_representation: DataCite REST API JSON:API
  path_delimiter: .

defaults:
  metadata_language: en
  datacite_type: dois
  resource_type_general: Dataset
  alternative_title_type: AlternativeTitle
  name_identifier_scheme_type: ORCID
  name_identifier_scheme_uri: https://orcid.org
  custodian_type: DataManager
  point_of_contact_type: ContactPerson
  rights_holder_type: RightsHolder
  data_collector_type: DataCollector
  other_contributor_type: Other
  funder_type: FundingReference

mappings:

  #TODO check how 'id' and 'type' are supposed to be mapped. All examples show these as present outside of the attributes block as 'dois' and the normalized doi identifier, but they're not described in the metadata properties docs.
  - id: primary_datacite_identifier
    source: optional_additional_metadata.resourceIdentifier
    target: data.id
    transformer: strip_to_doi_identifier

  - id: primary_datacite_identifier_type
    source: null
    target: data.type
    default_value: datacite_type

  # Copy the more specific resource type into the DataCite Types object.
  # resourceType is the a free-text field describing the type of the resource. This is a mandatory field.
  # resourceTypeGeneral is the controlled vocab for the type of the resource.
  # The current BSI Core template permits only the value `Dataset`, so we'll use this for both.
  - id: resource_type
    source: required_metadata.resourceType
    target: data.attributes.types      
    mode: single_object
    inner_object_mappings:
      - source: "@value"
        target: resourceType
      - source: null
        target: resourceTypeGeneral
        default_value: resource_type_general


  # Convert the resource identifier into the canonical DOI identifier that
  # identifies the DataCite record's dataset.
  - id: primary_identifier
    source: optional_additional_metadata.resourceIdentifier
    target: data.attributes.doi
    transformer: strip_to_doi_identifier

  # Add the required BSI title as the primary DataCite title.
  - id: main_title
    source: required_metadata.title
    target: data.attributes.titles
    inner_object_mappings:
    - source: "@value"
      target: title

  # Add every BSI alternative title as a DataCite AlternativeTitle.
  - id: alternative_titles
    source: optional_additional_metadata.alternativeTitle
    target: data.attributes.titles
    inner_object_mappings:
      - source: "@value"
        target: title
      - source: null
        target: titleType
        default_value: alternative_title_type

  # Select agents whose role is `author` and add them as DataCite Creators.
  - id: creators
    source: required_metadata.agents
    filter:
      role: author
    target: data.attributes.creators
    inner_object_mappings:
      - source: name
        target: name
      - source: agentType
        target: nameType
        transformer: transform_using_value_map
        parameters:
          value_map:
            person: Personal
            organisation: Organizational
      - source: orcid
        target: nameIdentifiers
        inner_object_mappings:
          - source: "@value"
            target: nameIdentifier
            transformer: normalise_orcid
          - source: null
            target: nameIdentifierScheme
            default_value: name_identifier_scheme_type
          - source: null
            target: schemeUri
            default_value: name_identifier_scheme_uri
      - source: affiliation
        target: affiliation
        inner_object_mappings:
          - source: "@value"
            target: name

  # Select agents whose role is `custodian` and add them as DataManager
  # Contributors; this expresses custodianship using the closest DataCite role.
  - id: custodians
    source: required_metadata.agents
    filter:
      role: custodian
    target: data.attributes.contributors
    inner_object_mappings:
      - source: name
        target: name
      - source: agentType
        target: nameType
        transformer: transform_using_value_map
        parameters:
          value_map:
            person: Personal
            organisation: Organizational
      - source: orcid
        target: nameIdentifiers
        inner_object_mappings:
          - source: "@value"
            target: nameIdentifier
            transformer: normalise_orcid
          - source: null
            target: nameIdentifierScheme
            default_value: name_identifier_scheme_type
          - source: null
            target: schemeUri
            default_value: name_identifier_scheme_uri
      - source: affiliation
        target: affiliation
        inner_object_mappings:
          - source: "@value"
            target: name
      - source: null
        target: contributorType
        default_value: custodian_type
    
  # Select `pointOfContact` agents and add them as ContactPerson Contributors.
  - id: points_of_contact
    source: required_metadata.agents
    filter:
      role: pointOfContact
    target: data.attributes.contributors
    inner_object_mappings:
      - source: name
        target: name
      - source: agentType
        target: nameType
        transformer: transform_using_value_map
        parameters:
          value_map:
            person: Personal
            organisation: Organizational
      - source: orcid
        target: nameIdentifiers
        inner_object_mappings:
          - source: "@value"
            target: nameIdentifier
            transformer: normalise_orcid
          - source: null
            target: nameIdentifierScheme
            default_value: name_identifier_scheme_type
          - source: null
            target: schemeUri
            default_value: name_identifier_scheme_uri
      - source: affiliation
        target: affiliation
        inner_object_mappings:
          - source: "@value"
            target: name
      - source: null
        target: contributorType
        default_value: point_of_contact_type

  # Select `dataCollector` agents and add them as DataCollector Contributors.
  - id: data_collectors
    source: required_metadata.agents
    filter:
      role: dataCollector
    target: data.attributes.contributors
    inner_object_mappings:
      - source: name
        target: name
      - source: agentType
        target: nameType
        transformer: transform_using_value_map
        parameters:
          value_map:
            person: Personal
            organisation: Organizational
      - source: orcid
        target: nameIdentifiers
        inner_object_mappings:
          - source: "@value"
            target: nameIdentifier
            transformer: normalise_orcid
          - source: null
            target: nameIdentifierScheme
            default_value: name_identifier_scheme_type
          - source: null
            target: schemeUri
            default_value: name_identifier_scheme_uri
      - source: affiliation
        target: affiliation
        inner_object_mappings:
          - source: "@value"
            target: name
      - source: null
        target: contributorType
        default_value: data_collector_type

  # Select generic `contributor` agents and add them as Other Contributors.
  - id: other_contributors
    source: required_metadata.agents
    filter:
      role: contributor
    target: data.attributes.contributors
    inner_object_mappings:
      - source: name
        target: name
      - source: agentType
        target: nameType
        transformer: transform_using_value_map
        parameters:
          value_map:
            person: Personal
            organisation: Organizational
      - source: orcid
        target: nameIdentifiers
        inner_object_mappings:
          - source: "@value"
            target: nameIdentifier
            transformer: normalise_orcid
          - source: null
            target: nameIdentifierScheme
            default_value: name_identifier_scheme_type
          - source: null
            target: schemeUri
            default_value: name_identifier_scheme_uri
      - source: affiliation
        target: affiliation
        inner_object_mappings:
          - source: "@value"
            target: name
      - source: null
        target: contributorType
        default_value: other_contributor_type

  # Select `funder` agents and add their names as DataCite FundingReferences.
  - id: funders
    source: required_metadata.agents
    filter:
      role: funder
    target: data.attributes.fundingReferences
    inner_object_mappings:
      - source: name
        target: funderName

  # Map the required BSI publisher name to the DataCite publisher property.
  - id: publisher
    source: required_metadata.publisher
    target: data.attributes.publisher
    mode: single_object
    inner_object_mappings:
      - source: "@value"
        target: name

  # Derive DataCite publicationYear from the year component of datePublished.
  - id: publication_year
    source: optional_additional_metadata.datePublished
    target: data.attributes.publicationYear
    transformer: year_from_date


